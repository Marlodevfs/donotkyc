name: Report a change
description: A listed platform changed its KYC policy, its limits, its fees, or closed.
title: "Listing update: "
labels: ["listing-update"]
body:
  - type: input
    id: name
    attributes: { label: Platform name }
    validations: { required: true }
  - type: dropdown
    id: what
    attributes:
      label: What changed?
      options: [It now asks for ID, Limits changed, Fees changed, Countries blocked changed, The site is down or closed, It looks like a scam, Something else]
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, and when. Screenshots help (remove any personal data first).
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source, description: "Link to the platform's announcement or terms, if any." }
