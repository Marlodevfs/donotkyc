name: deploy
# Construit le site et le publie sur GitHub Pages sans commiter docs/.
# Lancé à la main pour l'instant. Une fois Pages réglé sur « GitHub Actions » (Settings > Pages > Source),
# on ajoutera les déclencheurs push sur main et la reconstruction nocturne, puis on retirera docs/ du dépôt.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci && npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
